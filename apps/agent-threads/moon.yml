---
$schema: "file://../../../.moon/cache/schemas/project.json"

language: typescript
layer: tool

project:
  name: agent-threads

toolchains:
  default: ["javascript", "bun"]

tasks:
  typecheck:
    command: "bunx tsc --noEmit"
    inputs:
      - "package.json"
      - "tsconfig.json"
      - "src/**/*.ts"

  build:
    type: run
    deps:
      - "~:typecheck"
    inputs:
      - "package.json"
      - "src/**/*.ts"
    outputs:
      - "dist/agent-threads-*"
    options:
      runInCI: true
    script: |
      set -euo pipefail
      platform="$(bun -e 'console.log(process.platform)')"
      arch="$(bun -e 'console.log(process.arch)')"
      ext=""
      if [ "$platform" = "win32" ]; then ext=".exe"; fi
      mkdir -p dist
      bun build ./src/index.ts --compile --target "bun-${platform}-${arch}" --outfile "dist/agent-threads-${platform}-${arch}${ext}"

  lint:
    deps:
      - "~:typecheck"
    command: "noop"

  test:
    command: "bun test"
    inputs:
      - "src/**/*.ts"

  install:
    script: |
      set -euo pipefail
      mkdir -p "$HOME/.local/bin"
      wrapper="$HOME/.local/bin/agent-threads"
      printf '%s\n' '#!/usr/bin/env sh' "exec bun '$PWD/src/index.ts' \"\$@\"" > "$wrapper"
      chmod +x "$wrapper"
    inputs:
      - "src/**/*.ts"
    options:
      cache: false
      runInCI: false

  publish:
    type: run
    deps:
      - "~:build"
    inputs:
      - "dist/agent-threads-*"
    options:
      cache: false
      runInCI: true
    script: |
      set -euo pipefail

      repo="${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required}"
      tag="${PUBLISH_RELEASE_TAG:?PUBLISH_RELEASE_TAG is required}"

      gh release view "$tag" --repo "$repo" >/dev/null
      uploaded=0
      for asset in dist/agent-threads-*; do
        test -f "$asset" || continue
        gh release upload "$tag" "$asset#$(basename "$asset")" --repo "$repo" --clobber
        uploaded=$((uploaded + 1))
      done
      test "$uploaded" -gt 0
