[package]
name = "zellij-plugin-agent-threads"
version = "0.1.0"
edition = "2021"
description = "Zellij plugin that lists Pi agent sessions"
license = "MIT"

[dependencies]
zellij-tile = "=0.44.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = "2.21"
minijinja-embed = "2.21"
zellij-template-render = { git = "https://github.com/zenobi-us/zellij-plugins", rev = "1fd4f483a728708bd54a662deffd6a5206beb850" }

[build-dependencies]
minijinja-embed = "2.21"
